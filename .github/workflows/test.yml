name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the legacy bytecode engine
        run: python3 lab.py build
      - name: Check native engines, inference, analysis and resource controls
        run: python3 -m unittest discover -s tests -v
