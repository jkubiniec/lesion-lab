<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 668" role="img" aria-labelledby="title description">
<title id="title">Persistent injury versus population replacement</title><desc id="description">Original injured individuals retain their masks. A fall in injured survivors is attrition or replacement, not healing. Healthy newborns have new identities.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526579"/></marker></defs>
