<text x="38.00" y="44.00" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172D42" text-anchor="start" font-weight="700">Persistent injury versus population replacement</text>
<text x="38.00" y="77.00" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#253C50" text-anchor="start" font-weight="400">Same injured identities tracked through follow-up; the mask has no repair or plasticity rule.</text>
<text x="79.00" y="122.00" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#253C50" text-anchor="start" font-weight="700">Original injured individuals still alive</text>
