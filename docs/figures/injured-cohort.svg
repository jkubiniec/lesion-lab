<text x="719.00" y="560.00" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#253C50" text-anchor="start" font-weight="400">Scattered units</text>
<text x="38.00" y="609.00" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#253C50" text-anchor="start" font-weight="400">A population can regain task performance while injured individuals disappear and healthy offspring enter.</text>
<text x="38.00" y="631.00" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#253C50" text-anchor="start" font-weight="400">This model cannot establish neural repair: acquired masks persist, and lifetime weight learning is absent.</text>
<text x="38.00" y="653.00" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#253C50" text-anchor="start" font-weight="400">Sham has no injured cohort; its births appear in the right panel.</text>
