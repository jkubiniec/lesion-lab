<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 717" role="img" aria-labelledby="title description">
<title id="title">From BFF inspiration to an engineered neural population</title><desc id="description">The linked apankrat/bff repository is a Brainfuck interpreter. The computational-life experiment uses self-modifying programs and emergent replication. Lesion Lab supplies neural controllers and birth rules explicitly.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526579"/></marker></defs>
<rect width="1200" height="717" fill="#FFFFFF"/>
<text x="38.00" y="44.00" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172D42" text-anchor="start" font-weight="700">From BFF inspiration to an engineered neural population</text>
<rect x="38.00" y="100.00" width="340.00" height="191.00" rx="10" fill="#EFF4F8" stroke="#C5D1DA"/>
<text x="56.00" y="130.00" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243B53" text-anchor="start" font-weight="700">Linked apankrat/bff repository</text>
<text x="56.00" y="158.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Brainfuck interpreter</text>
<text x="56.00" y="181.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Executes source instructions</text>
<text x="56.00" y="204.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Not a neural controller</text>
<text x="56.00" y="227.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Does not supply a population or</text>
<text x="56.00" y="250.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">the interview&#x27;s replication world</text>
<rect x="430.00" y="100.00" width="730.00" height="191.00" rx="10" fill="#EDF7F7" stroke="#C5D1DA"/>
<text x="448.00" y="130.00" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#007C83" text-anchor="start" font-weight="700">Computational Life / CuBFF research inspiration</text>
<text x="448.00" y="158.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Mutable instruction tapes interact in a shared environment</text>
<text x="448.00" y="181.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Programs can copy instructions into other tapes</text>
<text x="448.00" y="204.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Replication is an empirical emergence criterion</text>
<text x="448.00" y="227.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">This is the relevant reproduction reference</text>
<text x="448.00" y="250.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Neural weights are a different substrate</text>
<text x="600.00" y="333.00" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#253C50" text-anchor="middle" font-weight="400">Conceptual inspiration: evolvable computation + controlled perturbation</text>
<line x1="600.00" y1="350.00" x2="600.00" y2="384.00" stroke="#AAB7C4" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="38.00" y="401.00" width="340.00" height="179.00" rx="10" fill="#EDF7F7" stroke="#C5D1DA"/>
<text x="56.00" y="431.00" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#007C83" text-anchor="start" font-weight="700">Lesion Lab neural substrate</text>
<text x="56.00" y="459.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Randomly initialized recurrent agents</text>
<text x="56.00" y="482.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Weights are inherited genotypes</text>
<text x="56.00" y="505.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Task performance changes energy</text>
<text x="56.00" y="528.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Birth and mutation are explicit</text>
<text x="56.00" y="551.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Evolution selects among lineages</text>
<rect x="430.00" y="401.00" width="340.00" height="179.00" rx="10" fill="#FFF1EC" stroke="#C5D1DA"/>
<text x="448.00" y="431.00" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#B53C36" text-anchor="start" font-weight="700">Controlled acquired injury</text>
<text x="448.00" y="459.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Fork a single common checkpoint</text>
<text x="448.00" y="482.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Sham vs designated vs scattered</text>
<text x="448.00" y="505.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Match disabled-unit counts</text>
<text x="448.00" y="528.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Apply a persistent identity mask</text>
<text x="448.00" y="551.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Keep inherited weights intact</text>
<rect x="822.00" y="401.00" width="340.00" height="179.00" rx="10" fill="#EFF4F8" stroke="#C5D1DA"/>
<text x="840.00" y="431.00" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243B53" text-anchor="start" font-weight="700">Auditable comparisons</text>
<text x="840.00" y="459.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Frozen-weight task assays</text>
<text x="840.00" y="482.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Pair immediate tests by identity</text>
<text x="840.00" y="505.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Track births and injured survivors</text>
<text x="840.00" y="528.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Test cue/memory dependence</text>
<text x="840.00" y="551.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Save code, data, and checkpoints</text>
<line x1="378.00" y1="490.00" x2="418.00" y2="490.00" stroke="#AAB7C4" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="770.00" y1="490.00" x2="810.00" y2="490.00" stroke="#AAB7C4" stroke-width="1" marker-end="url(#arrow)"/>
<text x="38.00" y="628.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">Expansion: a neural state-and-inheritance model with persistent lesions and matched controls.</text>
<text x="38.00" y="651.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">The neural experiment does not demonstrate spontaneous reproduction, consciousness, psychological trauma,</text>
<text x="38.00" y="674.00" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#253C50" text-anchor="start" font-weight="400">or human traumatic brain injury. Reproduction is supplied; functional localization is unverified.</text>
</svg>
